<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>uPlot Evenly Shared Vertical Space</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.25/dist/uPlot.min.css">
  <script src="https://cdn.jsdelivr.net/npm/uplot@1.6.25/dist/uPlot.iife.min.js"></script>
  <style>
    html {
      height: 100%;
    }
    body {
      min-height: 100%;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f4f4f9;
    }
    .chart-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #ffffff;
      padding: 16px;
      border-radius: 8px;
      width: 100%;
      min-height: 450px;
      height: calc(100vh - 80px);
      box-sizing: border-box;
    }
    .chart-wrapper {
      flex: 1;                /* Forces exact 50/50 vertical split */
      min-height: 180px;      /* Minimum height per sub-plot */
      display: flex;
      flex-direction: column;
    }
    .chart-wrapper > div {
      flex: 1;
    }
  </style>
</head>
<body>

  <div class="chart-container" id="container">
    <div class="chart-wrapper" id="wrapper-top">
      <div id="chart-top"></div>
    </div>
    <div class="chart-wrapper" id="wrapper-bottom">
      <div id="chart-bottom"></div>
    </div>
  </div>

  <script>
    const xValues = Array.from({ length: 10 }, (_, i) => i + 1);
    const seriesDataTop = [12, 19, 3, 5, 2, 8, 15, 9, 14, 11];
    const seriesDataBottom = [1045, 1042, 1058, 1062, 1055, 1070, 1068, 1080, 1075, 1088];

    const sync = uPlot.sync("stacked-plots");
    const Y_AXIS_WIDTH = 60;

    const container = document.getElementById("container");
    const wrapperTop = document.getElementById("wrapper-top");
    const wrapperBottom = document.getElementById("wrapper-bottom");

    // Get dimensions based on actual DOM layout
    function getWidth() {
      return container.clientWidth - 32;
    }

    const baseOpts = {
      width: getWidth(),
      padding: [10, 20, 10, 15], 
      scales: {
        x: { time: false }
      },
      legend: { show: false },
      cursor: {
        sync: { key: sync.key }
      }
    };

    const optsTop = {
      ...baseOpts,
      height: wrapperTop.clientHeight,
      axes: [
        { 
          size: 0,             
          grid: { show: true, width: 1, stroke: "#eee" },
          ticks: { show: false },
          values: () => []     
        }, 
        { 
          label: "Temp", 
          size: Y_AXIS_WIDTH,
          grid: { width: 1, stroke: "#eee" },
          ticks: { show: false }
        }
      ],
      series: [{}, { label: "Temp", stroke: "#3b82f6", width: 2 }]
    };

    const optsBottom = {
      ...baseOpts,
      height: wrapperBottom.clientHeight,
      axes: [
        { 
          space: 40,
          label: "Index",
          grid: { width: 1, stroke: "#eee" },
          ticks: { show: false }
        }, 
        { 
          label: "Pressure", 
          size: Y_AXIS_WIDTH,
          grid: { width: 1, stroke: "#eee" },
          ticks: { show: false }
        }
      ],
      series: [{}, { label: "Pressure", stroke: "#10b981", width: 2 }]
    };

    // Create chart instances
    const uTop = new uPlot(optsTop, [xValues, seriesDataTop], document.getElementById("chart-top"));
    const uBottom = new uPlot(optsBottom, [xValues, seriesDataBottom], document.getElementById("chart-bottom"));

    // ResizeObserver tracks container layout shifts and applies exact wrapper dimensions
    const resizeObserver = new ResizeObserver(() => {
      const width = getWidth();
      if (width > 0) {
        uTop.setSize({ width, height: wrapperTop.clientHeight });
        uBottom.setSize({ width, height: wrapperBottom.clientHeight });
      }
    });

    resizeObserver.observe(container);
  </script>

</body>
</html>
