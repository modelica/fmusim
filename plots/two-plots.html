<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>uPlot Perfectly Aligned Sub-plots</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.25/dist/uPlot.min.css">
  <script src="https://cdn.jsdelivr.net/npm/uplot@1.6.25/dist/uPlot.iife.min.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 20px;
      background: #f4f4f9;
    }
    .chart-container {
      background: #ffffff;
      padding: 16px;
      border-radius: 8px;
      width: 600px;
    }
  </style>
</head>
<body>

  <h3>uPlot - Vertically Stacked & Perfectly Aligned</h3>
  <div class="chart-container">
    <div id="chart-top"></div>
    <div id="chart-bottom"></div>
  </div>

  <script>
    const now = Math.floor(Date.now() / 1000);
    const times = Array.from({ length: 10 }, (_, i) => now + i * 60);

    const seriesDataTop = [12, 19, 3, 5, 2, 8, 15, 9, 14, 11];
    const seriesDataBottom = [1045, 1042, 1058, 1062, 1055, 1070, 1068, 1080, 1075, 1088];

    const sync = uPlot.sync("stacked-plots");

    const Y_AXIS_WIDTH = 60;

    const baseOpts = {
      width: 580,
      height: 180,
      // [top, right, bottom, left] padding explicitly locked to match right edges
      padding: [10, 20, 10, 15], 
      cursor: {
        sync: { key: sync.key }
      }
    };

    const optsTop = {
      ...baseOpts,
      axes: [
        { show: false }, 
        { 
          label: "Temp",
          size: Y_AXIS_WIDTH 
        }
      ],
      series: [{}, { label: "Temp", stroke: "#3b82f6", width: 2 }]
    };

    const optsBottom = {
      ...baseOpts,
      axes: [
        { space: 40 }, 
        { 
          label: "Pressure",
          size: Y_AXIS_WIDTH 
        }
      ],
      series: [{}, { label: "Pressure", stroke: "#10b981", width: 2 }]
    };

    new uPlot(optsTop, [times, seriesDataTop], document.getElementById("chart-top"));
    new uPlot(optsBottom, [times, seriesDataBottom], document.getElementById("chart-bottom"));
  </script>

</body>
</html>
