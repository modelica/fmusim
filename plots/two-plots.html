<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>uPlot Stacked Sub-plots Example</title>
  <!-- Load uPlot CSS and JS from CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.25/dist/uPlot.min.css">
  <script src="https://cdn.jsdelivr.net/npm/uplot@1.6.25/dist/uPlot.iife.min.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 20px;
      background: #f4f4f9;
      color: #333;
    }
    .chart-container {
      background: #ffffff;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      width: 600px;
    }
    .uplot {
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <h3>uPlot - Vertically Stacked Sub-plots</h3>
  <div class="chart-container">
    <div id="chart-top"></div>
    <div id="chart-bottom"></div>
  </div>

  <script>
    // 10 shared timestamp values (x-axis in seconds)
    const now = Math.floor(Date.now() / 1000);
    const times = Array.from({ length: 10 }, (_, i) => now + i * 60);

    // 10 data values for each subplot
    const seriesDataTop = [12, 19, 3, 5, 2, 8, 15, 9, 14, 11];
    const seriesDataBottom = [45, 42, 58, 62, 55, 70, 68, 80, 75, 88];

    // Synchronize cursor and zoom across both charts
    const sync = uPlot.sync("stacked-plots");

    // Base configuration shared by both plots
    const baseOpts = {
      width: 580,
      height: 180,
      cursor: {
        sync: {
          key: sync.key,
        }
      }
    };

    // Configuration for Top Sub-plot
    const optsTop = {
      ...baseOpts,
      title: "Sub-plot 1: Temperature (°C)",
      axes: [
        { show: false }, // Hide X-axis on top plot for seamless visual stacking
        { label: "Temp" }
      ],
      series: [
        {},
        {
          label: "Temp",
          stroke: "#3b82f6",
          width: 2,
          fill: "rgba(59, 130, 246, 0.1)"
        }
      ]
    };

    // Configuration for Bottom Sub-plot
    const optsBottom = {
      ...baseOpts,
      title: "Sub-plot 2: Humidity (%)",
      axes: [
        { space: 40 }, // Show X-axis timestamps on the bottom plot
        { label: "Humidity" }
      ],
      series: [
        {},
        {
          label: "Humidity",
          stroke: "#10b981",
          width: 2,
          fill: "rgba(16, 185, 129, 0.1)"
        }
      ]
    };

    // Create uPlot instances sharing the exact same time array
    const dataTop = [times, seriesDataTop];
    const dataBottom = [times, seriesDataBottom];

    new uPlot(optsTop, dataTop, document.getElementById("chart-top"));
    new uPlot(optsBottom, dataBottom, document.getElementById("chart-bottom"));
  </script>

</body>
</html>
