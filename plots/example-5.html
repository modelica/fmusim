<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>uPlot Responsive Full-Width Sub-plots</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.25/dist/uPlot.min.css">
  <script src="https://cdn.jsdelivr.net/npm/uplot@1.6.25/dist/uPlot.iife.min.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 20px;
      background: #f4f4f9;
    }
    .chart-container {
      background: #ffffff;
      padding: 16px;
      border-radius: 8px;
      width: 100%;            /* Fills full width of parent */
      max-width: 900px;       /* Optional: limits maximum width */
      box-sizing: border-box; /* Includes padding in width calculation */
    }
  </style>
</head>
<body>

  <h3>uPlot - Fully Responsive & Aligned Sub-plots</h3>
  <div class="chart-container" id="container">
    <div id="chart-top"></div>
    <div id="chart-bottom"></div>
  </div>

  <script>
    const xValues = Array.from({ length: 10 }, (_, i) => i + 1);
    const seriesDataTop = [12, 19, 3, 5, 2, 8, 15, 9, 14, 11];
    const seriesDataBottom = [1045, 1042, 1058, 1062, 1055, 1070, 1068, 1080, 1075, 1088];

    const sync = uPlot.sync("stacked-plots");
    const Y_AXIS_WIDTH = 60;

    const container = document.getElementById("container");

    // Calculate chart width based on container width minus its horizontal padding (16px * 2)
    function getChartWidth() {
      return container.clientWidth - 32;
    }

    const baseOpts = {
      width: getChartWidth(),
      height: 180,
      padding: [10, 20, 10, 15], 
      scales: {
        x: { time: false }
      },
      cursor: {
        sync: { key: sync.key }
      }
    };

    const optsTop = {
      ...baseOpts,
      axes: [
        { 
          size: 0,             
          grid: { show: true },
          ticks: { show: false },
          values: () => []     
        }, 
        { label: "Temp", size: Y_AXIS_WIDTH }
      ],
      series: [{}, { label: "Temp", stroke: "#3b82f6", width: 2 }]
    };

    const optsBottom = {
      ...baseOpts,
      axes: [
        { 
          space: 40,
          label: "Index"
        }, 
        { label: "Pressure", size: Y_AXIS_WIDTH }
      ],
      series: [{}, { label: "Pressure", stroke: "#10b981", width: 2 }]
    };

    // Create chart instances
    const uTop = new uPlot(optsTop, [xValues, seriesDataTop], document.getElementById("chart-top"));
    const uBottom = new uPlot(optsBottom, [xValues, seriesDataBottom], document.getElementById("chart-bottom"));

    // Handle window resize dynamically
    window.addEventListener("resize", () => {
      const newWidth = getChartWidth();
      uTop.setSize({ width: newWidth, height: 180 });
      uBottom.setSize({ width: newWidth, height: 180 });
    });
  </script>

</body>
</html>
