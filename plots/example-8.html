<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>uPlot Thin Grid Lines Example</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.25/dist/uPlot.min.css">
  <script src="https://cdn.jsdelivr.net/npm/uplot@1.6.25/dist/uPlot.iife.min.js"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f4f4f9;
    }
    .chart-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #ffffff;
      padding: 16px;
      border-radius: 8px;
      width: 100%;
      height: calc(100vh - 80px);
      box-sizing: border-box;
    }
    .chart-wrapper {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .chart-wrapper > div {
      flex: 1;
    }
  </style>
</head>
<body>

  <div class="chart-container" id="container">
    <div class="chart-wrapper">
      <div id="chart-top"></div>
    </div>
    <div class="chart-wrapper">
      <div id="chart-bottom"></div>
    </div>
  </div>

  <script>
    const xValues = Array.from({ length: 10 }, (_, i) => i + 1);
    const seriesDataTop = [12, 19, 3, 5, 2, 8, 15, 9, 14, 11];
    const seriesDataBottom = [1045, 1042, 1058, 1062, 1055, 1070, 1068, 1080, 1075, 1088];

    const sync = uPlot.sync("stacked-plots");
    const Y_AXIS_WIDTH = 60;

    const container = document.getElementById("container");

    function getChartDimensions() {
      const width = container.clientWidth - 32;
      const totalInnerHeight = container.clientHeight - 32 - 12;
      const height = Math.floor(totalInnerHeight / 2);
      return { width, height };
    }

    const { width, height } = getChartDimensions();

    const baseOpts = {
      width: width,
      height: height,
      padding: [10, 20, 10, 15], 
      scales: {
        x: { time: false }
      },
      legend: { show: false },
      cursor: {
        sync: { key: sync.key }
      }
    };

    const optsTop = {
      ...baseOpts,
      axes: [
        { 
          size: 0,             
          grid: { 
            show: true, 
            width: 0.5,           // Thinner vertical grid lines (e.g. 0.5px)
            stroke: "#eee"        // Optional: Lighter grid color
          },
          ticks: { show: false },
          values: () => []     
        }, 
        { 
          label: "Temp", 
          size: Y_AXIS_WIDTH,
          grid: { width: 0.5, stroke: "#eee" } // Thinner horizontal grid lines
        }
      ],
      series: [{}, { label: "Temp", stroke: "#3b82f6", width: 2 }]
    };

    const optsBottom = {
      ...baseOpts,
      axes: [
        { 
          space: 40,
          label: "Index",
          grid: { width: 0.5, stroke: "#eee" } // Thinner vertical grid lines
        }, 
        { 
          label: "Pressure", 
          size: Y_AXIS_WIDTH,
          grid: { width: 0.5, stroke: "#eee" } // Thinner horizontal grid lines
        }
      ],
      series: [{}, { label: "Pressure", stroke: "#10b981", width: 2 }]
    };

    const uTop = new uPlot(optsTop, [xValues, seriesDataTop], document.getElementById("chart-top"));
    const uBottom = new uPlot(optsBottom, [xValues, seriesDataBottom], document.getElementById("chart-bottom"));

    const resizeObserver = new ResizeObserver(() => {
      const dims = getChartDimensions();
      if (dims.width > 0 && dims.height > 0) {
        uTop.setSize(dims);
        uBottom.setSize(dims);
      }
    });

    resizeObserver.observe(container);
  </script>

</body>
</html>
