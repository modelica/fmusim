[package]
name = "fmusim"
version.workspace = true
edition.workspace = true

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
csv = "1.4.0"
crash-handler = "0.8"
fmi-rs = { version = "0.2.0", features = ["schema", "sundials"]}
libloading = "0.9.0"
plotly = "0.14.1"
roxmltree = "0.21.1"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
tempfile = "3.27"
term_size = "0.3"
zip = "8.6"
anyhow = "1.0.104"
clap-markdown = "0.1.5"
itertools = "0.15.0"

[dev-dependencies]
fmi-rs = { version = "0.2.0", features = ["test-fixtures"] }
rstest = "0.27.0"

[lints]
workspace = true
