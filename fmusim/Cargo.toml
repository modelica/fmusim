[package]
name = "fmusim"
version.workspace = true
edition.workspace = true

[dependencies]
annotate-snippets = "0.12.16"
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
askama = "0.16.0"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap-markdown = "0.1.5"
csv = "1.4.0"
crash-handler = "0.8"
fmi-rs = { version = "0.2.0", features = ["schema", "sundials"]}
itertools = "0.15.0"
libloading = "0.9.0"
pathdiff = "0.2"
plotly = "0.14.1"
roxmltree = "0.21.1"
serde = { version = "1.0", features = ["derive"] }
tempfile = "3.27"
term_size = "0.3"
toml = "1.1"
zip = "8.6"

[dev-dependencies]
fmi-rs = { version = "0.2.0", features = ["test-fixtures"] }
rstest = "0.27.0"

[lints]
workspace = true
